name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          cmdline-tools-version: 'latest'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests before building APK
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK (only if tests pass)
        run: gradle --no-daemon assembleDebug

      - name: Package complete Android project
        run: |
          zip -r alasal2027-source.zip . \
            -x ".git/*" ".gradle/*" "*/build/*" "build/*" "local.properties"
      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: alasal2027-source-project
          path: alasal2027-source.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alasal2027-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

